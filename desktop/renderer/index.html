<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="hud" id="hud">
    <div class="bar drag">
      <span class="pulse"></span><span class="brand">lowkeyhud</span>
      <button class="icon-btn" id="menu-btn" title="options">⋯</button>
      <button class="icon-btn" id="quit-btn" title="quit">✕</button>
    </div>

    <div class="clock drag" id="clock-wrap" title="drag to move">
      <span id="clock">--:--</span><span id="seconds">--</span>
    </div>

    <div class="roast drag" id="roast" title="drag to move"></div>

    <div class="focus">
      <span class="f-label">FOCUS</span>
      <span class="f-time" id="f-time">25:00</span>
      <button class="f-btn" id="f-btn">start</button>
    </div>

    <div class="foot drag" id="foot">
      <span class="no-cap">no cap</span>
      <span class="hint">drag · ⋯ for options</span>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
